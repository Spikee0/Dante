<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triplice web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>inicio do triplice web</h1>
        <label for="usuario">Usuario</label>
        <input id="usuario">
    <br>
    <label for="Senha">Senha</label>
    <input type="password" id="Senha">
    <br>
    <label for="Email">Email</label>
    <input type="Email" id="Email">
    <br>
    <label for="Foto">Foto Perfil</label>
    <input type="file" accept="image/png" id="foto">
    <br>
    <label>Turno</label>
    <label>Matutino<input type="Radio" name="Turno"></label>
    <label>Verspertino<input type="Radio" name="Turno"></label>
    <label>Noturno<input type="Radio" name="Turno"></label>
    <br>
    <label for="lembrar">Lembrar-me
    <input type="checkbox" id="lembrar">
    </label>
    <br>
    <label for="nascimento">Data de nascimento
        <input type="date" id="nascimento">
    </label>
    <br>
    <label for="Reset">apagar
        <input type="Reset" id="reset">
    </label>
    <br>
    <script src="script.js"></script>
</body>
</html>
