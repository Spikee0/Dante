<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Atividade01</title>
    <link rel = "stylesheet" href="atividade01Style.css">
</head>
<body>
<form name="formulario">
    <label for="nome">Nome:
        <br>
    <input type="text" name="nome" id="nome" placeholder="ex:joão silva" required>
    </label>

    <label for="email">Email:
        <br>
        <input type="Email" name="Email" id="Email"placeholder="exemplo@dominio.com" required>
    </label>

    <label for="senha">Palavra-passe:
        <br>
        <input type="password" name="senha" id="senha">
    </label>

    <label for="Idade">Idade:
        <br>
    <input type="Number" name="Idade" id="Idade">
    </label>

    <label for="DataNascimento">Data de nascimento:
        <br>
        <input type="Date" name="DataNascimento" id="DataNascimento">
    </label>

    <label>Genero:</label>
    <label>Masc.<input type="Radio" name="Masculino"></label>
    <label>Fem.<input type="Radio" name="Feminino"></label>
    <br>
    <label>Turno:</label>
        <label>Matutino <input type="checkbox" id="Matutino"></label>
        <label>Vespertino <input type="checkbox" id="Vespertino"></label>
        <label>Noturno <input type="checkbox" id="Noturno"></label>
    <br>
    <label for="Cor">Cor de destaque</label>
    <input type="color" name="Cor" id="Cor">

</form>

</body>
</html>
